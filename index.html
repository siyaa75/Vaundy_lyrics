        s.title.toLowerCase().includes(searchTerm) || 
        s.enTitle.toLowerCase().includes(searchTerm) ||
        (s.num && s.num.includes(searchTerm))
      );

      // Ensure Add Custom Song button is always visible or integrated nicely
      const addCustomBtnHtml = `
        <button id="openCustomSongBtn" class="w-full text-left px-3 py-2.5 mt-2 rounded-xl border border-dashed border-yellow-500/50 hover:bg-yellow-900/20 text-yellow-400 transition-all duration-150 flex items-center justify-center gap-2 group">
          <svg class="w-4 h-4 group-hover:scale-110 transition-transform" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4"></path></svg>
          <span class="text-sm font-bold">自訂新增歌詞</span>
        </button>
      `;

      if (filtered.length === 0) {
        listEl.innerHTML = `<div class="p-4 text-center text-xs text-gray-500">找不到相符的歌曲</div>` + addCustomBtnHtml;
      } else {
        listEl.innerHTML = filtered.map(song => {
          const isActive = song.id === currentSongId;
          const isCustom = song.isCustom;
          return `
            <button onclick="selectSong('${song.id}')"
              class="w-full text-left px-3 py-2.5 rounded-xl transition-all duration-150 flex items-center justify-between group ${
                isActive
                  ? "bg-gradient-to-r from-red-900/90 to-red-800/80 border border-yellow-400/80 shadow-[0_0_10px_rgba(251,238,79,0.25)]"
                  : "hover:bg-red-950/60 border border-transparent text-gray-300"
              }">
              <div class="flex items-center gap-2.5 truncate">
                <span class="font-mono text-xs font-bold ${isActive ? 'text-yellow-400' : 'text-red-400/70 group-hover:text-yellow-400'}">
                  ${song.num}
                </span>
                <div class="truncate">
                  <div class="text-xs md:text-sm font-bold truncate ${isActive ? 'text-white' : 'text-gray-200 group-hover:text-white'}">
                    ${song.title}
                  </div>
                  <div class="text-[10px] text-gray-400 truncate">
                    ${song.enTitle}
                  </div>
                </div>
              </div>
              ${isActive ? '<span class="w-1.5 h-1.5 rounded-full bg-yellow-400 shadow-[0_0_6px_#fbee4f] flex-shrink-0"></span>' : ''}
              ${isCustom && !isActive ? '<span class="text-[10px] text-yellow-500/50 border border-yellow-500/30 px-1 rounded">自訂</span>' : ''}
            </button>
          `;
        }).join("") + addCustomBtnHtml;
      }

      // Re-attach event listener for the dynamic button
      const openCustomBtn = document.getElementById('openCustomSongBtn');
      if (openCustomBtn) {
        openCustomBtn.addEventListener('click', openCustomModal);
      }
      
      document.getElementById('songCountDisplay').innerText = `共 ${songData.length} 首參戰精選`;
    }

    function selectSong(id) {
      currentSongId = id;
      renderSidebar();
      renderContent();

      // On mobile, close sidebar drawer after selection
      if (window.innerWidth < 768) {
        toggleMobileSidebar(false);
      }
    }

    function renderContent() {
      const song = songData.find(s => s.id === currentSongId);
      if (!song) return;

      const container = document.getElementById("contentContainer");

      const fontSizeClasses = [
        "text-sm leading-relaxed",
        "text-base leading-relaxed md:text-lg",
        "text-lg leading-loose md:text-xl"
      ][fontSizeState];

      container.innerHTML = `
        <article class="bg-[#1b0306]/90 border border-red-800/60 rounded-2xl p-5 md:p-8 shadow-2xl backdrop-blur-md relative overflow-hidden">
          
          <!-- Top Badge & Subtitle -->
          <div class="flex flex-wrap items-center justify-between gap-3 border-b border-red-900/60 pb-5 mb-6">
            <div>
              <div class="flex items-center gap-2 mb-1">
                <span class="px-2 py-0.5 rounded bg-red-950 border border-yellow-500/40 text-xs font-mono font-bold text-yellow-400">
                  TRACK ${song.num}
                </span>
                <span class="text-xs text-yellow-200/80 font-medium">${song.theme}</span>
              </div>
              <h2 class="text-2xl md:text-4xl font-black text-white tracking-tight flex items-baseline gap-3">
                ${song.title}
                <span class="text-sm md:text-lg font-normal text-red-300 font-sans opacity-80">${song.enTitle}</span>
              </h2>
            </div>
            <div class="px-3 py-1 rounded-full border border-cyan-400/40 bg-cyan-950/40 text-cyan-300 text-xs font-bold tracking-wide">
              ${song.vibe}
            </div>
          </div>

          <!-- Section 1: Song Encyclopedia -->
          <div class="mb-6 rounded-xl bg-black/40 border border-red-900/40 p-4 md:p-5">
            <h3 class="text-sm font-bold text-[#fbee4f] flex items-center gap-2 mb-2 tracking-wide uppercase">
              <svg class="w-4 h-4 text-yellow-400" fill="currentColor" viewBox="0 0 20 20"><path d="M9 4.804A7.968 7.968 0 005.5 4c-1.255 0-2.443.29-3.5.804v10A7.969 7.969 0 015.5 14c1.669 0 3.218.51 4.5 1.385A7.962 7.962 0 0114.5 14c1.255 0 2.443.29 3.5.804v-10A7.968 7.968 0 0014.5 4c-1.255 0-2.443.29-3.5.804V12a1 1 0 11-2 0V4.804z"></path></svg>
              歌曲小百科 (Song Profile)
            </h3>
            <p class="text-sm md:text-base text-gray-300 leading-relaxed">
              ${song.bg}
            </p>
          </div>

          <!-- Section 2: Concert Interaction Tips -->
          <div class="mb-7 rounded-xl bg-gradient-to-r from-red-950/80 via-red-900/40 to-black/50 border border-yellow-500/40 p-4 md:p-5">
            <h3 class="text-sm font-bold text-yellow-300 flex items-center gap-2 mb-2 tracking-wide uppercase">
              <svg class="w-4 h-4 text-cyan-400" fill="currentColor" viewBox="0 0 20 20"><path fill-rule="evenodd" d="M9.383 3.076A1 1 0 0110 4v12a1 1 0 01-1.707.707L4.586 13H2a1 1 0 01-1-1V8a1 1 0 011-1h2.586l3.707-3.707a1 1 0 011.09-.217zM14.657 2.929a1 1 0 011.414 0A9.972 9.972 0 0119 10a9.972 9.972 0 01-2.929 7.071 1 1 0 01-1.414-1.414A7.971 7.971 0 0017 10c0-2.21-.894-4.208-2.343-5.657a1 1 0 010-1.414zm-2.829 2.828a1 1 0 011.415 0A5.983 5.983 0 0115 10a5.984 5.984 0 01-1.757 4.243 1 1 0 01-1.415-1.415A3.984 3.984 0 0013 10a3.983 3.983 0 00-1.172-2.828 1 1 0 010-1.415z" clip-rule="evenodd"></path></svg>
              現場互動＆大合唱提點 (Live Tips)
            </h3>
            <p class="text-sm md:text-base text-yellow-100 font-medium leading-relaxed">
              ${song.liveTip}
            </p>
          </div>

          <!-- Section 3: Core Singalong Highlights Card (Furigana / Romaji / Translation) -->
          <div class="mb-6">
            <div class="flex flex-col sm:flex-row sm:items-center justify-between mb-3 gap-2">
              <h3 class="text-sm font-bold text-cyan-300 tracking-wider flex items-center gap-2">
                <span>✦</span> 歌詞對照 (UtaTen 格式)
              </h3>
              <span class="text-xs text-gray-400 bg-black/40 px-2 py-1 rounded">※ 僅收錄核心合唱段落，完整歌詞請搜尋</span>
            </div>

            <div class="space-y-4 bg-black/60 border border-red-950 rounded-xl p-4 md:p-6 ${fontSizeClasses}">
              ${song.quoteLines.map((line) => `
                <div class="group border-b border-red-950/80 pb-3 last:border-none last:pb-0">
                  <!-- Japanese Lyric with Ruby -->
                  <div class="text-white font-bold tracking-wider font-['Noto_Sans_JP']">
                    ${line.kanji}
                  </div>
                  <!-- Romaji -->
                  <div class="romaji-line text-xs md:text-sm text-cyan-300/80 font-mono mt-0.5">
                    ${line.romaji}
                  </div>
                  <!-- Chinese Translation -->
                  <div class="text-xs md:text-sm text-gray-300 font-normal mt-0.5">
                    ${line.zh}
                  </div>
                </div>
              `).join("")}
            </div>
          </div>

          <!-- Section 4: Full Licensed Lyrics Search -->
          <div class="pt-5 border-t border-red-900/40 flex flex-col sm:flex-row items-start sm:items-center justify-between gap-3 text-xs text-gray-400">
            <p>※ 深入練習整首歌曲，可前往合法授權歌詞網站查詢完整原文：</p>
            <a href="https://www.google.com/search?q=${encodeURIComponent(song.searchQuery)}"
               target="_blank"
               rel="noopener noreferrer"
               class="inline-flex items-center gap-1.5 px-4 py-2 rounded-xl bg-gradient-to-r from-red-950 to-red-900/80 hover:from-yellow-400 hover:to-yellow-500 hover:text-black text-yellow-300 border border-red-700/60 font-bold transition-all flex-shrink-0 shadow-lg group">
              <span>在 Google 搜尋《${song.title}》完整歌詞</span>
              <svg class="w-3.5 h-3.5 transition-transform group-hover:translate-x-0.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 6H6a2 2 0 00-2 2v10a2 2 0 002 2h10a2 2 0 002-2v-4M14 4h6m0 0v6m0-6L10 14"></path></svg>
            </a>
          </div>

        </article>
      `;
      applyDisplaySettings();
    }

    function applyDisplaySettings() {
      const container = document.getElementById("contentContainer");
      if (!container) return;

      if (showRuby) {
        container.classList.remove("hide-ruby");
      } else {
        container.classList.add("hide-ruby");
      }

      if (showRomaji) {
        container.classList.remove("hide-romaji");
      } else {
        container.classList.add("hide-romaji");
      }

      document.getElementById("rubyStatus").innerText = showRuby ? "開" : "關";
      document.getElementById("romajiStatus").innerText = showRomaji ? "開" : "關";
    }

    // Sidebar Toggle Functions
    function toggleMobileSidebar(open) {
      isSidebarOpenMobile = open !== undefined ? open : !isSidebarOpenMobile;
      const sidebar = document.getElementById("songSidebar");
      const backdrop = document.getElementById("sidebarBackdrop");

      if (isSidebarOpenMobile) {
        sidebar.classList.remove("-translate-x-full");
        backdrop.classList.remove("opacity-0", "pointer-events-none");
        backdrop.classList.add("opacity-100", "pointer-events-auto");
      } else {
        sidebar.classList.add("-translate-x-full");
        backdrop.classList.add("opacity-0", "pointer-events-none");
        backdrop.classList.remove("opacity-100", "pointer-events-auto");
      }
    }

    function toggleDesktopSidebar() {
      isSidebarOpenDesktop = !isSidebarOpenDesktop;
      const sidebar = document.getElementById("songSidebar");
      const toggleText = document.getElementById("toggleButtonText");

      if (isSidebarOpenDesktop) {
        sidebar.classList.remove("md:hidden");
        toggleText.innerText = "收合曲目欄";
      } else {
        sidebar.classList.add("md:hidden");
        toggleText.innerText = "展開曲目欄";
      }
    }

    document.getElementById("sidebarToggleBtn").addEventListener("click", () => {
      if (window.innerWidth < 768) {
        toggleMobileSidebar();
      } else {
        toggleDesktopSidebar();
      }
    });

    document.getElementById("sidebarBackdrop").addEventListener("click", () => {
      toggleMobileSidebar(false);
    });

    // Real-time Song Search Filter
    document.getElementById("songSearchInput").addEventListener("input", () => {
      renderSidebar();
    });

    // Display Toggles
    document.getElementById("toggleRubyBtn").addEventListener("click", () => {
      showRuby = !showRuby;
      applyDisplaySettings();
    });

    document.getElementById("toggleRomajiBtn").addEventListener("click", () => {
      showRomaji = !showRomaji;
      applyDisplaySettings();
    });

    document.getElementById("increaseFont").addEventListener("click", () => {
      if (fontSizeState < 2) {
        fontSizeState++;
        updateFontSizeLabel();
        renderContent();
      }
    });

    document.getElementById("decreaseFont").addEventListener("click", () => {
      if (fontSizeState > 0) {
        fontSizeState--;
        updateFontSizeLabel();
        renderContent();
      }
    });

    function updateFontSizeLabel() {
      const labels = ["小", "中", "大"];
      document.getElementById("fontSizeDisplay").innerText = labels[fontSizeState];
    }

    // --- Custom Song Modal Logic ---
    const modal = document.getElementById('customSongModal');
    const modalContent = document.getElementById('customSongModalContent');
    const lyricBlocksContainer = document.getElementById('lyricBlocksContainer');

    function openCustomModal() {
      modal.classList.remove('opacity-0', 'pointer-events-none');
      setTimeout(() => {
        modalContent.classList.remove('scale-95');
        modalContent.classList.add('scale-100');
      }, 10);
    }

    function closeCustomModal() {
      modalContent.classList.remove('scale-100');
      modalContent.classList.add('scale-95');
      setTimeout(() => {
        modal.classList.add('opacity-0', 'pointer-events-none');
      }, 200);
    }

    document.getElementById('closeModalBtn').addEventListener('click', closeCustomModal);
    document.getElementById('cancelModalBtn').addEventListener('click', closeCustomModal);
    
    // Close modal when clicking outside
    modal.addEventListener('click', (e) => {
      if (e.target === modal) {
        closeCustomModal();
      }
    });

    // Add Lyric Block
    document.getElementById('addLyricBlockBtn').addEventListener('click', () => {
      const blockHTML = `
        <div class="lyric-block bg-black/30 p-4 rounded-xl border border-red-950 relative mt-4">
          <button class="remove-lyric-btn absolute top-2 right-2 text-gray-500 hover:text-red-400 p-1" title="移除此段落" onclick="this.closest('.lyric-block').remove(); updateRemoveButtons();">
            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path></svg>
          </button>
          <div class="space-y-3">
            <div>
              <input type="text" class="custom-input border-gray-700 lyric-kanji" placeholder="日文歌詞 (可包含 Ruby 語法)">
            </div>
            <div>
              <input type="text" class="custom-input border-gray-700 lyric-romaji text-cyan-300/80 font-mono text-xs" placeholder="羅馬拼音 (選填)">
            </div>
            <div>
              <input type="text" class="custom-input border-gray-700 lyric-zh text-gray-300" placeholder="中文翻譯 (選填)">
            </div>
          </div>
        </div>
      `;
      lyricBlocksContainer.insertAdjacentHTML('beforeend', blockHTML);
      updateRemoveButtons();
    });

    function updateRemoveButtons() {
      const blocks = lyricBlocksContainer.querySelectorAll('.lyric-block');
      const firstBtn = blocks[0].querySelector('.remove-lyric-btn');
      if (blocks.length > 1) {
        firstBtn.classList.remove('hidden');
      } else {
        firstBtn.classList.add('hidden');
      }
    }

    // Save Custom Song
    document.getElementById('saveCustomSongBtn').addEventListener('click', () => {
      const titleInput = document.getElementById('customTitle');
      if (!titleInput.value.trim()) {
        titleInput.classList.add('border-red-500', 'animate-pulse');
        setTimeout(() => titleInput.classList.remove('border-red-500', 'animate-pulse'), 2000);
        return;
      }

      customSongsCount++;
      const numStr = `C${String(customSongsCount).padStart(2, '0')}`;
      const newId = `custom-song-${Date.now()}`;

      const quoteLines = [];
      const blocks = lyricBlocksContainer.querySelectorAll('.lyric-block');
      blocks.forEach(block => {
        const kanji = block.querySelector('.lyric-kanji').value.trim();
        if (kanji) {
          quoteLines.push({
            kanji: kanji,
            romaji: block.querySelector('.lyric-romaji').value.trim(),
            zh: block.querySelector('.lyric-zh').value.trim()
          });
        }
      });

      // No length limit for user's custom songs, allowing full songs to be added manually
      const newSong = {
        id: newId,
        num: numStr,
        title: titleInput.value.trim(),
        enTitle: document.getElementById('customEnTitle').value.trim() || 'Custom Title',
        theme: document.getElementById('customTheme').value.trim() || 'User Added',
        vibe: document.getElementById('customVibe').value.trim() || 'Custom',
        bg: document.getElementById('customBg').value.trim() || '無提供歌曲背景。',
        liveTip: document.getElementById('customLiveTip').value.trim() || '無提供互動提點。',
        quoteLines: quoteLines.length > 0 ? quoteLines : [
          { kanji: "歌詞尚未輸入", romaji: "-", zh: "-" }
        ],
        searchQuery: `${titleInput.value.trim()} 歌詞`,
        isCustom: true
      };

      songData.push(newSong);
      
      // Reset form
      titleInput.value = '';
      document.getElementById('customEnTitle').value = '';
      document.getElementById('customTheme').value = '';
      document.getElementById('customVibe').value = '';
      document.getElementById('customBg').value = '';
      document.getElementById('customLiveTip').value = '';
      
      // Reset lyric blocks to just one empty block
      const firstBlock = lyricBlocksContainer.querySelector('.lyric-block');
      firstBlock.querySelector('.lyric-kanji').value = '';
      firstBlock.querySelector('.lyric-romaji').value = '';
      firstBlock.querySelector('.lyric-zh').value = '';
      lyricBlocksContainer.innerHTML = '';
      lyricBlocksContainer.appendChild(firstBlock);
      updateRemoveButtons();

      closeCustomModal();
      
      // Select the new song
      document.getElementById('songSearchInput').value = ''; // Clear search to ensure it shows
      selectSong(newId);
    });

    // Initialize
    renderSidebar();
    renderContent();
  </script>
</body>
</html>
